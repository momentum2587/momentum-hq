function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function todayStr() {
  return localDateStr(new Date());

function getISOWeek(date = new Date()) {
  const d = new Date(date);
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
  const w1 = new Date(d.getFullYear(), 0, 4);
  return `${d.getFullYear()}-W${String(1 + Math.round(((d - w1) / 86400000 - 3 + (w1.getDay() + 6) % 7) / 7)).padStart(2, "0")}`;
}
function getWeekStart(wid) {
  const [yr, wk] = wid.split("-W");
  const j4 = new Date(Number(yr), 0, 4);
  const dow = (j4.getDay() + 6) % 7;
  const m = new Date(j4);
  m.setDate(j4.getDate() - dow);
  m.setDate(m.getDate() + (Number(wk) - 1) * 7);
  return m;
}
function getUpcomingMondays(n = 16) {
  const mondays = [];
  const d = new Date();
  const day = d.getDay();
  const diff = day === 1 ? 0 : (8 - day) % 7 || 7;
  d.setDate(d.getDate() + diff);
  d.setHours(12, 0, 0, 0);
  for (let i = 0; i < n; i++) {
    mondays.push(new Date(d));
    d.setDate(d.getDate() + 7);
  }
  return mondays;
}

function sumWeeks(weeks) {
  const b = blankWeek();
  const allContactIds = new Set();
  let hasAnyContactIds = false;
  let legacyContactsSum = 0;
  for (const w of weeks) {
    for (const k of Object.keys(b)) {
      // Skip contactsWorked — handled separately for proper dedup
      if (k === "contactsWorked" || k === "contactIds") continue;
      b[k] = (b[k] || 0) + (w[k] || 0);
    }
    if (Array.isArray(w.contactIds) && w.contactIds.length > 0) {
      hasAnyContactIds = true;
      w.contactIds.forEach(id => allContactIds.add(id));
    } else {
      // Legacy/manual row without contactIds — sum its count
      legacyContactsSum += w.contactsWorked || 0;
    }
  }
  // Combine deduped IDs with any legacy sums (legacy rows can't be deduped — best-effort)
  b.contactsWorked = allContactIds.size + legacyContactsSum;
  return b;
}
function getAggStats(history, period = "all") {
  if (!history || !history.length) return blankWeek();
  const now = new Date();
  let weeks = history;
  // Normalise period to {type, from, to} — accepts legacy string or new object
  const p = typeof period === "string" ? {
    type: period
  } : period || {
    type: "all"
  };
  const t = p.type;
  const sameMonth = (d, y, m) => d.getFullYear() === y && d.getMonth() === m;
  const sameQuarter = (d, y, q) => d.getFullYear() === y && Math.floor(d.getMonth() / 3) === q;
  if (t === "week") {
    const cur = getISOWeek();
    weeks = history.filter(h => h.weekId === cur);
  } else if (t === "lastWeek") {
    const lastMon = new Date(now);
    lastMon.setDate(now.getDate() - 7);
    const last = getISOWeek(lastMon);
    weeks = history.filter(h => h.weekId === last);
  } else if (t === "month") {
    weeks = history.filter(h => sameMonth(getWeekStart(h.weekId), now.getFullYear(), now.getMonth()));
  } else if (t === "lastMonth") {
    const lm = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    weeks = history.filter(h => sameMonth(getWeekStart(h.weekId), lm.getFullYear(), lm.getMonth()));
  } else if (t === "quarter") {
    const q = Math.floor(now.getMonth() / 3);
    weeks = history.filter(h => sameQuarter(getWeekStart(h.weekId), now.getFullYear(), q));
  } else if (t === "lastQuarter") {
    let qY = now.getFullYear(),
      qN = Math.floor(now.getMonth() / 3) - 1;
    if (qN < 0) {
      qN = 3;
      qY--;
    }
    weeks = history.filter(h => sameQuarter(getWeekStart(h.weekId), qY, qN));
  } else if (t === "custom" && p.from && p.to) {
    const fromD = new Date(p.from + "T00:00:00").getTime();
    const toD = new Date(p.to + "T23:59:59").getTime();
    weeks = history.filter(h => {
      const ws = getWeekStart(h.weekId).getTime();
      return ws >= fromD && ws <= toD;
    });
  }
  // "all" or unrecognised -> use full history
  return sumWeeks(weeks);
}

function calcTeamCommission(n) {
  let t = 0,
    r = n,

  for (const [max, rate] of [[10, 50], [20, 65], [Infinity, 85]]) {

    c += inn;

  }

// ── ICS export helper ─────────────────────────────────────────────────────────
function icsDate(dateStr, hour = 10) {
  const d = new Date(dateStr + "T" + String(hour).padStart(2, "0") + ":00:00");
  return d.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
}
function downloadICS(events) {
  const lines = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Momentum HQ//EN", "CALSCALE:GREGORIAN"];
  for (const ev of events) {
    lines.push("BEGIN:VEVENT");
    lines.push(`UID:${ev.id}@momentumhq`);
    lines.push(`DTSTART:${icsDate(ev.date, 10)}`);
    lines.push(`DTEND:${icsDate(ev.date, ev.endHour || 11)}`);
    lines.push(`SUMMARY:${ev.title}`);
    if (ev.notes) lines.push(`DESCRIPTION:${ev.notes.replace(/\n/g, "\\n")}`);
    lines.push("END:VEVENT");
  }
  lines.push("END:VCALENDAR");
  const blob = new Blob([lines.join("\r\n")], {
    type: "text/calendar"
  });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = "momentum-events.ics";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
