        const wStart=getWeekStart(displayWeek);const wEnd=new Date(wStart);wEnd.setDate(wEnd.getDate()+7);
        const wMtgs=(data.meetings||[]).filter(m=>{const d=new Date((m.attended||m.booked)+"T12:00:00");return d>=wStart&&d<wEnd&&(m.status==="attended"||m.status==="no-show");});
        const wAr=wMtgs.length>0?Math.round(wMtgs.filter(m=>m.status==="attended").length/wMtgs.length*100):null;

        const displayRows=[
          {key:"revenue",label:"Total Revenue",unit:"£",auto:null,targetKey:null,note:"Enter manually"},
          {key:"contactsRatio",label:"Contacts → Meeting",unit:"1:",auto:wCr,targetKey:"contactsRatio",note:"Auto from platform"},
          {key:"attendanceRate",label:"Meeting attendance",unit:"%",auto:wAr,targetKey:"attendanceRate",note:"Auto from platform"},
          {key:"deliveryPct",label:"% Time — Client Delivery",unit:"%",auto:displayKpi.deliveryPct||null,targetKey:"deliveryPct",note:"From Toggl"},
          {key:"managementPct",label:"% Time — Team Mgmt",unit:"%",auto:displayKpi.managementPct||null,targetKey:"managementPct",note:"From Toggl"},
          {key:"complianceChecks",label:"% Compliance checks",unit:"%",auto:null,targetKey:"complianceChecks",manual:true,note:"Gen enters"},
          {key:"applicantRatio",label:"Applicant → Interview",unit:"1:",auto:null,targetKey:"applicantRatio",manual:true,note:"Hannah enters"},
          {key:"qualifiedPct",label:"% Qualified applicants",unit:"%",auto:null,targetKey:"qualifiedPct",manual:true,note:"Hannah enters"},
        ];

        return <div style={{...S.card,marginBottom:16,border:`1px solid ${BRAND}30`,background:`linear-gradient(135deg,${BRAND}06,transparent)`}}>
          <div style={{fontSize:13,fontWeight:500,color:"var(--color-text-secondary)",marginBottom:12}}>
            {isCurrentWeek?"Enter or sync this week's numbers — auto metrics update when Gen enters client stats":"Viewing past week — click any manual metric to edit"}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:12}}>
            {displayRows.map(row=>{
              const val=row.auto!==null&&row.auto!==undefined?row.auto:(displayKpi[row.key]||null);
              const color=ragColor(val,row.targetKey,row.unit);
              return <div key={row.key} style={{background:"var(--color-background-primary)",borderRadius:8,padding:"12px",border:`0.5px solid var(--color-border-tertiary)`}}>
                <div style={{fontSize:11,color:"var(--color-text-tertiary)",marginBottom:4,lineHeight:1.3}}>{row.label}</div>
                {(row.manual||row.key==="revenue")&&adm
                  ?<input style={{...S.inp,fontSize:18,fontWeight:600,padding:"4px 8px",color,marginBottom:4}} type="number" value={displayKpi[row.key]||""} placeholder="—" onChange={e=>{const updated={...kpis,[displayWeek]:{...(kpis[displayWeek]||{}),[row.key]:Number(e.target.value)}};saveBH({kpis:updated});}}/>
                  :<div style={{fontSize:22,fontWeight:700,color,marginBottom:4}}>{val!==null?row.unit+val:"—"}</div>
                }
                {row.targetKey&&targets[row.targetKey]&&<div style={{fontSize:10,color:"var(--color-text-tertiary)"}}>Target: {row.unit+targets[row.targetKey]}</div>}
                <div style={{fontSize:10,color:"var(--color-border-secondary)",marginTop:2}}>{row.note}</div>
              </div>;
            })}
          </div>
        </div>;
      })()}

      {/* History table */}
      <div style={S.card}>
        <div style={{...S.row,justifyContent:"space-between",marginBottom:12}}>
          <div style={S.ct}>All weeks</div>
          <div style={{fontSize:12,color:"var(--color-text-tertiary)"}}>Click a row to select that week · Auto metrics recalculate from platform data</div>
        </div>
        {Object.keys(kpis).length===0&&<div style={{fontSize:12,color:"var(--color-text-tertiary)"}}>No KPI data yet — enter figures above to start tracking.</div>}
        {Object.keys(kpis).length>0&&<div style={{overflowX:"auto"}}>
          <table style={S.tbl}>
            <thead><tr>
              <th style={S.th}>Week</th>
              <th style={S.th}>Revenue</th>
              <th style={S.th}>Contacts→Mtg</th>
              <th style={S.th}>Attendance</th>
              <th style={S.th}>Delivery %</th>
              <th style={S.th}>Mgmt %</th>
              <th style={S.th}>Compliance</th>
              <th style={S.th}>Appl→Interview</th>
            </tr></thead>
            <tbody>{Object.entries(kpis).sort((a,b)=>b[0]>a[0]?1:-1).map(([wk,v])=>{
              const isSel=(selKpiWeek||currentWeek)===wk;
              // Recalculate auto metrics for this week
              const rowC=(data.clients||[]).reduce((a,cl)=>{const w=(cl.history||[]).find(h=>h.weekId===wk);return{c:a.c+(w?.contactsWorked||0),b:a.b+(w?.mb||0)};},{c:0,b:0});
              const rowCr=rowC.b>0?Math.round(rowC.c/rowC.b):null;
              const rStart=getWeekStart(wk);const rEnd=new Date(rStart);rEnd.setDate(rEnd.getDate()+7);
              const rMtgs=(data.meetings||[]).filter(m=>{const d=new Date((m.attended||m.booked)+"T12:00:00");return d>=rStart&&d<rEnd&&(m.status==="attended"||m.status==="no-show");});
              const rowAr=rMtgs.length>0?Math.round(rMtgs.filter(m=>m.status==="attended").length/rMtgs.length*100):null;
              return <tr key={wk} onClick={()=>setSelKpiWeek(wk)} style={{cursor:"pointer",background:isSel?BL:"transparent"}}>
                <td style={{...S.td,fontWeight:600,whiteSpace:"nowrap"}}>{wk}{wk===currentWeek&&<span style={{...S.bdg("booked"),marginLeft:4,fontSize:9}}>now</span>}</td>
                <td style={{...S.td,color:ragColor(v.revenue,null,"£")}}>{v.revenue?"£"+v.revenue.toLocaleString():"—"}</td>
                <td style={{...S.td,color:ragColor(rowCr,"contactsRatio","1:")}}>{rowCr?"1:"+rowCr:"—"}</td>
                <td style={{...S.td,color:ragColor(rowAr,"attendanceRate","%")}}>{rowAr!==null?rowAr+"%":"—"}</td>
                <td style={{...S.td,color:ragColor(v.deliveryPct,"deliveryPct","%")}}>{v.deliveryPct?v.deliveryPct+"%":"—"}</td>
                <td style={{...S.td,color:ragColor(v.managementPct,"managementPct","%")}}>{v.managementPct?v.managementPct+"%":"—"}</td>
                <td style={{...S.td,color:ragColor(v.complianceChecks,"complianceChecks","%")}}>{v.complianceChecks?v.complianceChecks+"%":"—"}</td>
                <td style={S.td}>{v.applicantRatio?"1:"+v.applicantRatio:"—"}</td>
              </tr>;
            })}</tbody>
          </table>
        </div>}
      </div>

      {/* Target settings */}
      {adm&&<div style={S.card}>
        <div style={{...S.ct,marginBottom:12}}>KPI Targets</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:10}}>
          {[
            {k:"contactsRatio",l:"Contacts → Meeting",u:"1:"},
            {k:"attendanceRate",l:"Attendance rate",u:"%"},
            {k:"deliveryPct",l:"Client Delivery %",u:"%"},
            {k:"managementPct",l:"Team Mgmt %",u:"%"},
            {k:"complianceChecks",l:"Compliance checks",u:"%"},
            {k:"applicantRatio",l:"Applicant → Interview",u:"1:"},
            {k:"qualifiedPct",l:"Qualified applicants",u:"%"},
          ].map(r=><div key={r.k}>
            <label style={S.lbl}>{r.l}</label>
            <div style={S.row}><span style={{fontSize:13,color:"var(--color-text-secondary)",flexShrink:0,paddingRight:4}}>{r.u}</span><input style={S.inp} type="number" value={targets[r.k]||""} onChange={e=>saveBH({kpiTargets:{...targets,[r.k]:Number(e.target.value)}})}/></div>
          </div>)}
        </div>
      </div>}
    </div>}

    {/* ── P&L ── */}
    {tab==="pnl"&&<div>
      <div style={{...S.row,justifyContent:"space-between",marginBottom:12}}>
        <div style={{fontSize:13,color:"var(--color-text-secondary)"}}>
          {adm?"Click any white cell to edit · Formula rows calculate automatically":"View only — Hannah can edit figures"}
        </div>
        {adm&&<button onClick={addMonth} style={{...S.btn(),fontSize:12,padding:"5px 12px",border:"1px dashed var(--color-border-secondary)"}}>+ Add month</button>}
      </div>
      <div style={{overflow:"auto",border:"1px solid #d0d0d0",borderRadius:8}}>
        <table style={{borderCollapse:"collapse",width:"100%",tableLayout:"auto",fontFamily:"Arial,sans-serif",fontSize:13}}>
          <thead>
            <tr style={{background:"#E8562A",color:"#fff"}}>
              <th style={{padding:"8px 14px",textAlign:"left",fontWeight:600,fontSize:12,position:"sticky",left:0,background:"#E8562A",zIndex:2,minWidth:220,whiteSpace:"nowrap"}}>Account</th>
              {pnlMonths.map(m=>{
                const isSel=m===selMonth;
                return <th key={m} onClick={()=>setSelMonth(m)} style={{padding:"8px 14px",textAlign:"right",fontWeight:600,fontSize:12,minWidth:120,whiteSpace:"nowrap",cursor:"pointer",background:isSel?"#B83E18":"#E8562A",borderLeft:"1px solid rgba(255,255,255,0.2)"}}>{fmtMonth(m).toUpperCase()}{isSel?" ▾":""}</th>;
              })}
            </tr>
          </thead>
          <tbody>{PNL_ROW_DEFS.map((row,ri)=>{
            // Precompute all months
            const allComputed=pnlMonths.map(m=>computePnL(pnl[m]||{}));

            if(row.type==="header")return <tr key={row.k}>
              <td colSpan={pnlMonths.length+1} style={{padding:"10px 14px 4px",fontWeight:700,fontSize:11,letterSpacing:"0.08em",textTransform:"uppercase",background:"#F5F5F3",color:"#5C5C57",borderTop:"2px solid #d0d0d0",borderBottom:"1px solid #d0d0d0"}}>{row.label}</td>
            </tr>;

            const isInput=row.type==="input";
            const isFormula=row.type==="formula"||row.type==="sum";
            const rowBg=row.hl==="green"?"#EAF3DE":row.hl==="blue"?"#E6F1FB":row.hl==="brand"?"#FDF0EC":ri%2===0?"#ffffff":"#FAFAF8";
            const labelWeight=row.bold?700:row.hl?600:400;
            const labelColor=row.hl==="green"?"#0F6E56":row.hl==="brand"?"#B83E18":row.hl==="blue"?"#185FA5":"#1A1915";
            const labelIndent=isInput&&!row.bold?28:14;

            return <tr key={row.k} style={{background:rowBg,borderBottom:"1px solid #e8e8e8"}}>
              <td style={{padding:"6px 14px 6px "+labelIndent+"px",fontWeight:labelWeight,color:labelColor,position:"sticky",left:0,background:rowBg,zIndex:1,whiteSpace:"nowrap",borderRight:"2px solid #d0d0d0"}}>{row.label}</td>
              {pnlMonths.map((m,mi)=>{
                const comp=allComputed[mi];
                const val=comp[row.k]||0;
                const isEditing=editCell===row.k+"|"+m;
                const isActiveMo=m===selMonth;
                const cellBg=isEditing?"#FFFDE7":isActiveMo&&isInput?"#FFFFF0":rowBg;
                const numColor=row.hl==="green"?"#0F6E56":row.hl==="brand"?"#B83E18":row.hl==="blue"?"#185FA5":val<0?"#A32D2D":"#1A1915";

                if(isInput&&adm){
                  return <td key={m} style={{padding:"4px 8px",textAlign:"right",background:cellBg,borderLeft:"1px solid #e8e8e8",borderRight:isActiveMo?"2px solid #B83E18":"none"}}>
                    {isEditing
                      ?<input autoFocus type="number" value={editVal} style={{width:100,textAlign:"right",border:"2px solid #E8562A",borderRadius:4,padding:"3px 6px",fontSize:13,fontFamily:"inherit",outline:"none"}} onChange={e=>setEditVal(e.target.value)} onBlur={()=>{const num=parseFloat(String(editVal).replace(/[£,]/g,""))||0;savePnL({...pnl,[m]:{...(pnl[m]||{}),[row.k]:num}});setEditCell(null);}} onKeyDown={e=>{if(e.key==="Enter"){const num=parseFloat(String(editVal).replace(/[£,]/g,""))||0;savePnL({...pnl,[m]:{...(pnl[m]||{}),[row.k]:num}});setEditCell(null);}if(e.key==="Escape")setEditCell(null);}}/>
                      :<span style={{display:"block",padding:"2px 4px",cursor:"pointer",color:numColor,fontWeight:labelWeight,borderBottom:"1px dashed #ccc"}} onClick={()=>{setEditCell(row.k+"|"+m);setEditVal(String((pnl[m]||{})[row.k]||0));}}>{row.pct?fmtPct(val):fmtPnl(val)}</span>
                    }
                  </td>;
                }
                return <td key={m} style={{padding:"6px 12px",textAlign:"right",color:isFormula?"#555":numColor,fontWeight:labelWeight,fontStyle:isFormula?"italic":"normal",background:cellBg,borderLeft:"1px solid #e8e8e8",borderRight:isActiveMo?"2px solid #B83E18":"none"}}>{row.pct?fmtPct(val):fmtPnl(val)}</td>;
              })}
            </tr>;
          })}</tbody>
        </table>
      </div>
    </div>}
  </div>;
}

// ── Shell ─────────────────────────────────────────────────────────────────────
function Shell({user,data,onSave,section,onSection,onLogout,onExport,onImport}){
  return <div style={S.app}>
    <Sidebar user={user} active={section} onNav={onSection} onLogout={onLogout} onExport={onExport} onImport={onImport}/>
    <main style={S.main}>
      {section==="overview"&&<Overview user={user} data={data} onNav={onSection}/>}
      {section==="dashboard"&&user.role==="salesperson"&&<GrowthPartnerDashboard user={user} data={data} onSave={onSave}/>}
      {section==="clients"&&<Clients user={user} data={data} onSave={onSave}/>}
      {section==="meetings"&&<Meetings user={user} data={data} onSave={onSave}/>}
      {section==="commissions"&&<Commissions user={user} data={data} onSave={onSave}/>}
      {section==="clientcommissions"&&(user.role==="admin"||user.role==="ops")&&<ClientCommissions user={user} data={data} onSave={onSave}/>}
      {section==="masterdata"&&<MasterData data={data}/>}
      {section==="leaderboard"&&<Leaderboard user={user} data={data} onSave={onSave}/>}
      {section==="teamcalendar"&&<TeamCalendar user={user} data={data} onSave={onSave}/>}
      {section==="mondaymeeting"&&<MondayMeeting user={user} data={data} onSave={onSave}/>}
      {section==="training"&&<Training user={user} data={data} onSave={onSave}/>}
      {section==="leave"&&<Leave user={user} data={data} onSave={onSave}/>}
      {section==="documents"&&<Documents user={user} data={data} onSave={onSave}/>}
      {section==="calendar"&&<ContentCalendar user={user} data={data} onSave={onSave}/>}
      {section==="performance"&&<PostPerformance user={user} data={data} onSave={onSave}/>}
      {section==="ideas"&&<IdeasBank user={user} data={data} onSave={onSave}/>}
      {section==="aidraft"&&<AiDraft/>}
      {section==="businesshub"&&(user.role==="admin"||user.role==="ops")&&(()=>{try{return <BusinessHub user={user} data={data} onSave={onSave}/>;}catch(e){return <div style={{padding:24}}><div style={{color:"#A32D2D",fontWeight:600,marginBottom:8}}>Business Hub error:</div><pre style={{fontSize:12,background:"#f9f9f9",padding:12,borderRadius:8,overflow:"auto"}}>{e.message}{"\n"}{e.stack}</pre></div>;}})()} 
    </main>
  </div>;
}

// ── App ───────────────────────────────────────────────────────────────────────
function App(){
  const[user,setUser]=useState(null);
  const[section,setSection]=useState("overview");
  const[data,setData]=useState(null);
  const[loading,setLoading]=useState(true);
  const[saveStatus,setSaveStatus]=useState("saved"); // "saved"|"saving"|"error"

  useEffect(()=>{
    dbLoad().then(loaded=>{
      // loaded will be {} if database is empty — treat that as no data
      let d=(loaded&&loaded.clients)?loaded:SEED;
      if(!d.closedWonDeals)d.closedWonDeals=[];
      if(!d.clientInvoices)d.clientInvoices=[];
      if(!d.mondayMeetings)d.mondayMeetings={};
      if(!d.meetings)d.meetings=[];
      if(!d.commissions)d.commissions=[];
      if(!d.leaveRequests)d.leaveRequests=[];
      if(!d.trainings)d.trainings=[];
      if(!d.documents)d.documents=[];
      if(!d.calendarEvents)d.calendarEvents=[];
      if(!d.clients)d.clients=[];
      if(!d.marketing)d.marketing={posts:[],ideas:[],weeklyStats:{}};
      if(!d.marketing.posts)d.marketing.posts=[];
      if(!d.marketing.ideas)d.marketing.ideas=[];
      if(!d.trainingColumns)d.trainingColumns=["Set-Up","Daily Systems","Messaging Frameworks","Cold Outreach Processes","Client Communications","Sales","Operations","Culture"];
      if(d.clients)d.clients=d.clients.map(cl=>({closedWonValue:0,...cl,history:cl.history||[],actions:cl.actions||[],insights:cl.insights||[],gps:cl.gps||[]}));
      if(d.commissions)d.commissions=d.commissions.map(c=>({contact:"",...c}));
      if(!d.qualData)d.qualData={};
      if(!d.hsHygiene)d.hsHygiene={};
      setData(d);
      setLoading(false);
    }).catch(()=>{
      // If Supabase fails entirely, fall back to seed data
      setData(SEED);
      setLoading(false);
    });
  },[]);

  const save=nd=>{
    setData(nd);
    setSaveStatus("saving");
    dbSave(nd).then(()=>setSaveStatus("saved")).catch(()=>setSaveStatus("error"));
  };

  const exportData=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=`momentum-hq-backup-${todayStr()}.json`;
    document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);
  };

  const importData=async imported=>{
    if(window.confirm("Replace all data with this backup? This will update the shared database for everyone."))await save(imported);
  };

  if(loading)return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",background:"var(--color-background-tertiary)",gap:16}}>
    <img src="mlogo.png" style={{width:36,height:36,borderRadius:"50%",display:"block"}}/>
    <div style={{fontSize:14,color:"var(--color-text-tertiary)"}}>Loading Momentum Hub…</div>
  </div>;

  if(!user)return <Login onLogin={u=>{setUser(u);setSection(u.role==="salesperson"?"dashboard":"overview");}}/>;
  return <>
    <Shell user={user} data={data} onSave={save} section={section} onSection={setSection} onLogout={()=>{setUser(null);setSection("overview");}} onExport={exportData} onImport={importData}/>
    <div style={{position:"fixed",bottom:12,right:16,fontSize:11,color:saveStatus==="error"?"#A32D2D":saveStatus==="saving"?"#854F0B":"#0F6E56",background:"#fff",padding:"3px 10px",borderRadius:12,boxShadow:"0 1px 4px rgba(0,0,0,0.1)",border:"0.5px solid var(--color-border-tertiary)",transition:"color 0.3s"}}>
      {saveStatus==="saving"?"● Saving…":saveStatus==="error"?"⚠ Save failed — check connection":"● Saved"}
    </div>
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
