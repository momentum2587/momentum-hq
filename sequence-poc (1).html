<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Sequence Builder POC v2 — diagnostic</title>

<!-- React 18 UMD + ReactDOM 18 UMD + Babel standalone -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<script>
  // Snapshot window keys BEFORE React Flow loads, so we can diff after.
  window.__preFlowKeys = Object.keys(window);
  window.__loadResults = {};
</script>

<!-- Attempt to load React Flow v10 from jsDelivr (proxies npm directly, very reliable).
     Use onload/onerror so we know whether the file was even reachable. -->
<script
  id="rf-script"
  src="https://cdn.jsdelivr.net/npm/react-flow-renderer@10.3.17/dist/umd/index.js"
  onload="window.__loadResults.jsdelivr='loaded'"
  onerror="window.__loadResults.jsdelivr='error'"
></script>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/react-flow-renderer@10.3.17/dist/style.min.css"/>

<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f3;color:#1a1915;min-height:100vh;}
:root{
  --color-background-primary:#ffffff;
  --color-background-tertiary:#eeede9;
  --color-text-primary:#1a1915;
  --color-text-secondary:#5c5c57;
  --color-text-tertiary:#9b9a96;
  --color-border-tertiary:#e8e7e3;
  --color-border-secondary:#d4d3cf;
  --color-accent:#0F6E56;
  --color-error:#A32D2D;
}
.react-flow__node-default{
  background:#ffffff;border:1px solid var(--color-border-secondary);border-radius:8px;
  font-size:13px;font-weight:500;color:var(--color-text-primary);
  padding:10px 14px;box-shadow:0 1px 2px rgba(0,0,0,0.04);min-width:140px;
}
.react-flow__node-default.selected{border-color:var(--color-accent);box-shadow:0 0 0 2px rgba(15,110,86,0.15);}
.react-flow__edge-path{stroke:#9b9a96;stroke-width:1.5;}
.react-flow__handle{background:#5c5c57;width:8px;height:8px;border:2px solid #ffffff;}
.react-flow__controls{box-shadow:0 1px 4px rgba(0,0,0,0.08);border-radius:6px;overflow:hidden;}
.react-flow__controls button{background:#ffffff;border-bottom:1px solid var(--color-border-tertiary);width:28px;height:28px;}
.react-flow__attribution{background:rgba(255,255,255,0.7);font-size:10px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const {useState,useEffect}=React;

// Candidate global names that a UMD build of react-flow-renderer might expose.
// We don't know for sure, so we check all plausible variants.
const CANDIDATE_GLOBALS=[
  "ReactFlowRenderer","ReactFlow","reactFlow","reactFlowRenderer",
  "RFRenderer","ReactflowRenderer","reactflow","Reactflow",
];

function findReactFlow(){
  for(const name of CANDIDATE_GLOBALS){
    const v=window[name];
    if(v&&(v.default||v.ReactFlow)){
      return {name,value:v};
    }
  }
  // Fallback: scan for any new global that looks like a React Flow bundle
  const before=new Set(window.__preFlowKeys||[]);
  const newKeys=Object.keys(window).filter(k=>!before.has(k)&&k!=="__preFlowKeys"&&k!=="__loadResults");
  for(const k of newKeys){
    const v=window[k];
    if(v&&typeof v==="object"&&(v.default||v.Background||v.Controls||v.ReactFlow)){
      return {name:k,value:v};
    }
  }
  return null;
}

function POC(){
  const [tick,setTick]=useState(0);

  // The script tag is parser-blocking — by the time Babel parses this block
  // it should already be done. But re-tick once just to be safe.
  useEffect(()=>{
    const t=setTimeout(()=>setTick(1),300);
    return ()=>clearTimeout(t);
  },[]);

  const found=findReactFlow();
  const before=new Set(window.__preFlowKeys||[]);
  const newGlobals=Object.keys(window).filter(k=>!before.has(k)&&!k.startsWith("__")).slice(0,30);

  const diag={
    reactVersion:React.version,
    scriptLoadResult:window.__loadResults?.jsdelivr||"unknown",
    foundUnder:found?.name||null,
    candidatesChecked:CANDIDATE_GLOBALS,
    newGlobalsAfterScript:newGlobals,
  };

  if(!found){
    return <div style={{padding:32,maxWidth:760,margin:"40px auto"}}>
      <div style={{background:"#fff",border:"1px solid var(--color-border-secondary)",borderRadius:10,padding:24}}>
        <div style={{fontSize:18,fontWeight:600,marginBottom:8,color:"var(--color-error)"}}>
          ❌ React Flow still not found
        </div>
        <div style={{fontSize:13,color:"var(--color-text-secondary)",marginBottom:16,lineHeight:1.6}}>
          Tried jsDelivr this time. Below shows whether the script tag itself loaded
          (the <code style={{background:"#eeede9",padding:"1px 5px",borderRadius:3}}>scriptLoadResult</code> field),
          and any new globals the script <em>did</em> attach to <code style={{background:"#eeede9",padding:"1px 5px",borderRadius:3}}>window</code>.
        </div>
        <div style={{fontSize:12,color:"var(--color-text-secondary)",marginBottom:8}}>
          <strong>How to read this:</strong>
        </div>
        <ul style={{fontSize:12,color:"var(--color-text-secondary)",marginLeft:20,marginBottom:16,lineHeight:1.7}}>
          <li><code>scriptLoadResult: "error"</code> → CDN file 404'd or was blocked. Need a different URL.</li>
          <li><code>scriptLoadResult: "loaded"</code> + <code>newGlobalsAfterScript: []</code> → File loaded but is ESM, not UMD. Won't work via script tag — needs the architecture change.</li>
          <li><code>scriptLoadResult: "loaded"</code> + some new globals listed → Tell me the names and I'll fix the lookup.</li>
        </ul>
        <pre style={{fontSize:11,background:"#1a1915",color:"#eeede9",padding:14,borderRadius:6,overflow:"auto",lineHeight:1.5}}>
{JSON.stringify(diag,null,2)}
        </pre>
      </div>
    </div>;
  }

  // Success path: try to render the canvas
  const RF=found.value;
  const ReactFlow=RF.default||RF.ReactFlow;
  const Background=RF.Background;
  const Controls=RF.Controls;

  const defaultNodes=[
    {id:"1",data:{label:"📞 Call · Day 1"},position:{x:160,y:80}},
    {id:"2",data:{label:"✉️ Email · Day 3"},position:{x:160,y:240}},
  ];
  const defaultEdges=[{id:"e1-2",source:"1",target:"2"}];

  return <div style={{minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    <div style={{background:"#fff",borderBottom:"1px solid var(--color-border-tertiary)",padding:"16px 24px"}}>
      <div style={{fontSize:12,color:"var(--color-text-tertiary)",fontWeight:500,letterSpacing:0.3,textTransform:"uppercase",marginBottom:2}}>
        Step A · Diagnostic v2
      </div>
      <div style={{fontSize:18,fontWeight:600,color:"var(--color-text-primary)"}}>
        ✓ React Flow loaded as <code style={{background:"var(--color-background-tertiary)",padding:"2px 8px",borderRadius:4,fontSize:14}}>window.{found.name}</code>
      </div>
      <div style={{fontSize:11,color:"var(--color-text-secondary)",marginTop:4}}>
        React {React.version} · jsDelivr · {window.__loadResults?.jsdelivr}
      </div>
    </div>
    <div style={{flex:1,minHeight:"calc(100vh - 90px)",position:"relative"}}>
      <ReactFlow defaultNodes={defaultNodes} defaultEdges={defaultEdges} fitView fitViewOptions={{padding:0.3}} proOptions={{hideAttribution:true}}>
        {Background&&<Background gap={20} size={1} color="#d4d3cf"/>}
        {Controls&&<Controls showInteractive={false} position="bottom-right"/>}
      </ReactFlow>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<POC/>);
</script>
</body>
</html>
